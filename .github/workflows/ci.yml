name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep this status context stable: main branch protection requires "Swift Build".
    name: Swift Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test with coverage
        run: swift test --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Enforce coverage thresholds
        run: scripts/check_coverage.sh
      - name: Build arm64 Release app
        env:
          ALLOW_ADHOC: "1"
        run: scripts/build_app.sh
      - name: Enforce status bar application policy
        run: |
          if rg -n 'setActivationPolicy\(\.regular\)' Sources/MacToolApp; then
            echo "MacToolApp must remain an accessory application" >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' '.build/Mac助手.app/Contents/Info.plist')" = "true"
      - name: Verify packaged architecture and signatures
        run: |
          app='.build/Mac助手.app'
          test "$(lipo -archs "$app/Contents/MacOS/mac-tool")" = "arm64"
          test "$(lipo -archs "$app/Contents/PlugIns/mac-tool-finder-sync.appex/Contents/MacOS/mac-tool-finder-sync")" = "arm64"
          test "$(lipo -archs "$app/Contents/Helpers/7zz")" = "arm64"
          test -f "$app/Contents/Resources/ThirdPartyLicenses/7-Zip.txt"
          "$app/Contents/Helpers/7zz" i >/dev/null
          codesign --verify --strict "$app/Contents/Helpers/7zz"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$(tr -d '[:space:]' < VERSION)"
          if rg -a -n '/Users/[^/]+/' "$app"; then
            echo "Packaged app contains a user-specific absolute path" >&2
            exit 1
          fi
