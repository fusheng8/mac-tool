name: Build DMG

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve app version
        run: |
          expected_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$expected_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION $expected_version" >&2
              exit 1
            fi
            echo "APP_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$expected_version" >> "$GITHUB_ENV"
          fi
          echo "APP_BUILD_VERSION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Select signed DMG source
        id: dmg_source
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12_BASE64" && -n "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "A signing identity is configured; building the DMG on the runner."
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]] && gh release view "$APP_VERSION" >/dev/null 2>&1; then
            mkdir -p "$PWD/.build"
            gh release download "$APP_VERSION" \
              --pattern "MacTool.dmg" \
              --dir "$PWD/.build" \
              --clobber
            test -f "$PWD/.build/MacTool.dmg"
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
            echo "Using the locally signed DMG from the draft GitHub Release."
          else
            echo "Formal release requires either signing-keychain secrets or a pre-signed MacTool.dmg in the tag's draft Release." >&2
            exit 1
          fi

      - name: Install signing keychain
        if: steps.dmg_source.outputs.mode == 'build'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo "Missing MACOS_CERTIFICATE_P12_BASE64; formal DMG builds never fall back to ad-hoc signing." >&2
            exit 1
          fi

          if [[ -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "Missing MACOS_CERTIFICATE_PASSWORD repository secret" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/fusheng-signing.p12"
          keychain_path="$RUNNER_TEMP/fusheng-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          rm -f "$certificate_path"

          if [[ -z "$MACOS_CODESIGN_IDENTITY" ]]; then
            MACOS_CODESIGN_IDENTITY="$(
              security find-identity -v -p codesigning "$keychain_path" \
                | awk -F '"' '/"(Apple Development|Developer ID Application):/ { print $2; exit }'
            )"
          fi

          if [[ -z "$MACOS_CODESIGN_IDENTITY" ]]; then
            echo "No valid code signing identity found in signing keychain" >&2
            exit 1
          fi

          echo "CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "Using code signing identity: $MACOS_CODESIGN_IDENTITY"

      - name: Build DMG
        if: steps.dmg_source.outputs.mode == 'build'
        env:
          DMG_NAME: "MacTool.dmg"
        run: scripts/build_dmg.sh

      - name: Verify release artifact
        if: steps.dmg_source.outputs.mode == 'build'
        run: |
          app='.build/Mac助手.app'
          test "$(lipo -archs "$app/Contents/MacOS/mac-tool")" = "arm64"
          test "$(lipo -archs "$app/Contents/PlugIns/mac-tool-finder-sync.appex/Contents/MacOS/mac-tool-finder-sync")" = "arm64"
          test "$(lipo -archs "$app/Contents/Helpers/7zz")" = "arm64"
          test -f "$app/Contents/Resources/ThirdPartyLicenses/7-Zip.txt"
          "$app/Contents/Helpers/7zz" i >/dev/null
          codesign --verify --strict "$app/Contents/Helpers/7zz"
          codesign --verify --deep --strict "$app"
          codesign --verify '.build/MacTool.dmg'
          codesign -d --verbose=4 "$app" 2>&1 | grep -F "Authority=$CODESIGN_IDENTITY"
          codesign -d --verbose=4 "$app/Contents/PlugIns/mac-tool-finder-sync.appex" 2>&1 | grep -F "Authority=$CODESIGN_IDENTITY"
          codesign -d --verbose=4 "$app" 2>&1 | grep -E 'flags=.*runtime'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$APP_BUILD_VERSION"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")"
          if grep -aR -n -E '/Users/[^/]+/' "$app"; then
            echo "Packaged app contains a user-specific absolute path" >&2
            exit 1
          fi

      - name: Remove signing keychain
        if: always() && steps.dmg_source.outputs.mode == 'build'
        run: |
          rm -f "$RUNNER_TEMP/fusheng-signing.p12"
          signing_keychain_path="${SIGNING_KEYCHAIN_PATH:-$RUNNER_TEMP/fusheng-signing.keychain-db}"
          if [[ -f "$signing_keychain_path" ]]; then
            security delete-keychain "$signing_keychain_path"
          fi

      - name: Resolve Sparkle tools for prebuilt DMG
        if: steps.dmg_source.outputs.mode == 'prebuilt'
        run: swift package resolve

      - name: Verify prebuilt signed release artifact
        if: steps.dmg_source.outputs.mode == 'prebuilt'
        run: |
          dmg="$PWD/.build/MacTool.dmg"
          mount_dir="$RUNNER_TEMP/mac-tool-dmg"
          mkdir -p "$mount_dir"
          hdiutil verify "$dmg"
          codesign --verify --strict "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null
          }
          trap cleanup EXIT

          app="$mount_dir/Mac助手.app"
          test -d "$app"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          test "$(lipo -archs "$app/Contents/MacOS/mac-tool")" = "arm64"
          test "$(lipo -archs "$app/Contents/PlugIns/mac-tool-finder-sync.appex/Contents/MacOS/mac-tool-finder-sync")" = "arm64"
          test "$(lipo -archs "$app/Contents/Helpers/7zz")" = "arm64"
          test -f "$app/Contents/Resources/ThirdPartyLicenses/7-Zip.txt"
          "$app/Contents/Helpers/7zz" i >/dev/null
          codesign --verify --strict "$app/Contents/Helpers/7zz"
          codesign --verify --deep --strict "$app"
          codesign -d --verbose=4 "$app" 2>&1 | grep -E 'flags=.*runtime'
          codesign -d --verbose=4 "$app" 2>&1 | grep -F 'TeamIdentifier=6N8KQ247WZ'
          codesign -d --verbose=4 "$app/Contents/PlugIns/mac-tool-finder-sync.appex" 2>&1 | grep -F 'TeamIdentifier=6N8KQ247WZ'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$APP_BUILD_VERSION"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")"
          if grep -aR -n -E '/Users/[^/]+/' "$app"; then
            echo "Packaged app contains a user-specific absolute path" >&2
            exit 1
          fi

      - name: Locate DMG
        id: dmg
        run: |
          dmg_path="$(find "$PWD/.build" -maxdepth 1 -type f -name "*.dmg" -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No DMG found in .build" >&2
            exit 1
          fi
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $dmg_path"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MacAssistant-DMG
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Generate Sparkle appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Missing SPARKLE_PRIVATE_KEY repository secret" >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/sparkle_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

          sparkle_bin="$(find "$PWD/.build" -path "*/Sparkle/bin/generate_appcast" -type f -print -quit)"
          if [[ -z "$sparkle_bin" ]]; then
            echo "Sparkle generate_appcast tool was not found" >&2
            exit 1
          fi

          appcast_dir="$PWD/.build/sparkle-appcast"
          mkdir -p "$appcast_dir"
          cp "${{ steps.dmg.outputs.path }}" "$appcast_dir/MacTool.dmg"

          "$sparkle_bin" \
            --ed-key-file "$key_path" \
            --download-url-prefix "https://github.com/fusheng8/mac-tool/releases/download/$GITHUB_REF_NAME/" \
            "$appcast_dir"

          test -f "$appcast_dir/appcast.xml"
          grep -q 'sparkle:edSignature=' "$appcast_dir/appcast.xml"
          mkdir -p "$PWD/.build/pages"
          cp "$appcast_dir/appcast.xml" "$PWD/.build/pages/appcast.xml"

      - name: Upload GitHub Pages artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: sparkle-appcast-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/pages

      - name: Deploy Sparkle appcast to GitHub Pages
        id: deployment
        if: github.ref_type == 'tag'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: sparkle-appcast-${{ github.run_id }}-${{ github.run_attempt }}
