name: Build DMG

on:
  push:
    branches:
      - main
      - master
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve app version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "APP_BUILD_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.1.0" >> "$GITHUB_ENV"
            echo "APP_BUILD_VERSION=0.1.0" >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        env:
          PACKAGE_ONLY: "1"
          CODESIGN_IDENTITY: "-"
          DMG_NAME: "MacTool.dmg"
        run: scripts/build_dmg.sh

      - name: Locate DMG
        id: dmg
        run: |
          dmg_path="$(find "$PWD/.build" -maxdepth 1 -type f -name "*.dmg" -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No DMG found in .build" >&2
            exit 1
          fi
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $dmg_path"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacAssistant-DMG
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Generate Sparkle appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Missing SPARKLE_PRIVATE_KEY repository secret" >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/sparkle_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

          sparkle_bin="$(find "$PWD/.build" -path "*/Sparkle/bin/generate_appcast" -type f -print -quit)"
          if [[ -z "$sparkle_bin" ]]; then
            echo "Sparkle generate_appcast tool was not found" >&2
            exit 1
          fi

          appcast_dir="$PWD/.build/sparkle-appcast"
          mkdir -p "$appcast_dir"
          cp "${{ steps.dmg.outputs.path }}" "$appcast_dir/MacTool.dmg"

          "$sparkle_bin" \
            --ed-key-file "$key_path" \
            --download-url-prefix "https://github.com/fusheng8/mac-tool/releases/download/$GITHUB_REF_NAME/" \
            "$appcast_dir"

          test -f "$appcast_dir/appcast.xml"
          mkdir -p "$PWD/.build/pages"
          cp "$appcast_dir/appcast.xml" "$PWD/.build/pages/appcast.xml"

      - name: Upload GitHub Pages artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/pages

      - name: Deploy Sparkle appcast to GitHub Pages
        id: deployment
        if: github.ref_type == 'tag'
        uses: actions/deploy-pages@v4
