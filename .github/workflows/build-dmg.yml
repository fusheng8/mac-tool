name: Build DMG

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve app version
        run: |
          expected_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$expected_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION $expected_version" >&2
              exit 1
            fi
            echo "APP_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$expected_version" >> "$GITHUB_ENV"
          fi
          echo "APP_BUILD_VERSION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Install signing keychain
        env:
          MACOS_KEYCHAIN_BASE64: ${{ secrets.MACOS_KEYCHAIN_BASE64 }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$MACOS_KEYCHAIN_BASE64" ]]; then
            echo "Missing MACOS_KEYCHAIN_BASE64; formal DMG builds never fall back to ad-hoc signing." >&2
            exit 1
          fi

          if [[ -z "$MACOS_KEYCHAIN_PASSWORD" ]]; then
            echo "Missing MACOS_KEYCHAIN_PASSWORD repository secret" >&2
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/fusheng.keychain"
          printf '%s' "$MACOS_KEYCHAIN_BASE64" | base64 --decode > "$keychain_path"
          chmod 600 "$keychain_path"

          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"

          if [[ -z "$MACOS_CODESIGN_IDENTITY" ]]; then
            MACOS_CODESIGN_IDENTITY="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/"Apple Development:/ { print $2; exit }')"
          fi

          if [[ -z "$MACOS_CODESIGN_IDENTITY" ]]; then
            echo "No valid code signing identity found in signing keychain" >&2
            exit 1
          fi

          echo "CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "Using code signing identity: $MACOS_CODESIGN_IDENTITY"

      - name: Build DMG
        env:
          DMG_NAME: "MacTool.dmg"
        run: scripts/build_dmg.sh

      - name: Verify release artifact
        run: |
          app='.build/Mac助手.app'
          test "$(lipo -archs "$app/Contents/MacOS/mac-tool")" = "arm64"
          test "$(lipo -archs "$app/Contents/PlugIns/mac-tool-finder-sync.appex/Contents/MacOS/mac-tool-finder-sync")" = "arm64"
          codesign --verify --deep --strict "$app"
          codesign --verify '.build/MacTool.dmg'
          codesign -d --verbose=4 "$app" 2>&1 | rg -F "Authority=$CODESIGN_IDENTITY"
          codesign -d --verbose=4 "$app/Contents/PlugIns/mac-tool-finder-sync.appex" 2>&1 | rg -F "Authority=$CODESIGN_IDENTITY"
          codesign -d --verbose=4 "$app" 2>&1 | rg 'flags=.*runtime'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$APP_VERSION"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")"
          if rg -a -n '/Users/[^/]+/' "$app"; then
            echo "Packaged app contains a user-specific absolute path" >&2
            exit 1
          fi

      - name: Locate DMG
        id: dmg
        run: |
          dmg_path="$(find "$PWD/.build" -maxdepth 1 -type f -name "*.dmg" -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No DMG found in .build" >&2
            exit 1
          fi
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $dmg_path"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacAssistant-DMG
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Generate Sparkle appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Missing SPARKLE_PRIVATE_KEY repository secret" >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/sparkle_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

          sparkle_bin="$(find "$PWD/.build" -path "*/Sparkle/bin/generate_appcast" -type f -print -quit)"
          if [[ -z "$sparkle_bin" ]]; then
            echo "Sparkle generate_appcast tool was not found" >&2
            exit 1
          fi

          appcast_dir="$PWD/.build/sparkle-appcast"
          mkdir -p "$appcast_dir"
          cp "${{ steps.dmg.outputs.path }}" "$appcast_dir/MacTool.dmg"

          "$sparkle_bin" \
            --ed-key-file "$key_path" \
            --download-url-prefix "https://github.com/fusheng8/mac-tool/releases/download/$GITHUB_REF_NAME/" \
            "$appcast_dir"

          test -f "$appcast_dir/appcast.xml"
          rg -q 'sparkle:edSignature=' "$appcast_dir/appcast.xml"
          mkdir -p "$PWD/.build/pages"
          cp "$appcast_dir/appcast.xml" "$PWD/.build/pages/appcast.xml"

      - name: Upload GitHub Pages artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: sparkle-appcast-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/pages

      - name: Deploy Sparkle appcast to GitHub Pages
        id: deployment
        if: github.ref_type == 'tag'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: sparkle-appcast-${{ github.run_id }}-${{ github.run_attempt }}
